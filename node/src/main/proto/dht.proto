syntax = "proto3";

package br.dev.ispchat.dht;
option java_multiple_files = true;
option java_package = "br.dev.ispchat.node.grpc.dht";

// The Kademlia DHT service for peer discovery and node routing.
service DhtService {
  
  // Basic health check
  rpc Ping (PingRequest) returns (PingResponse);

  // Store a value in the DHT (e.g. mapping UUID to an IP Address or Array of IPs)
  // This requires a cryptographic signature to prevent spoofing.
  rpc Store (StoreRequest) returns (StoreResponse);

  // Find a node (used for Kademlia routing table population)
  rpc FindNode (FindNodeRequest) returns (FindNodeResponse);

  // Find the location of a specific UUID (User's device)
  rpc FindValue (FindValueRequest) returns (FindValueResponse);
}

message PingRequest {
  string sender_id = 1;
}

message PingResponse {
  string receiver_id = 1;
}

message StoreRequest {
  // The UUIDv7 of the user
  string key = 1;
  // The IP Address / gRPC port where this user is currently online
  string ip_address = 2;
  // A timestamp to prevent replay attacks
  int64 timestamp = 3;
  // Cryptographic signature of (key + ip_address + timestamp) generated by the User's Private Key
  bytes signature = 4;
}

message StoreResponse {
  bool success = 1;
}

message FindNodeRequest {
  string target_id = 1;
}

message NodeInfo {
  string node_id = 1;
  string ip_address = 2;
}

message FindNodeResponse {
  repeated NodeInfo closest_nodes = 1;
}

message FindValueRequest {
  string key = 1;
}

message FindValueResponse {
  // If found, returns the IP addresses where the UUID is logged in
  repeated string ip_addresses = 1;
  // If not found, returns the closest nodes so the requestor can continue searching
  repeated NodeInfo closest_nodes = 2;
}
