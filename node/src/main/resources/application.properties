spring.application.name=node

# Modo Headless: sem servidor HTTP/Tomcat na porta 8080 (toda comunicacao ocorre via gRPC porta 443)
spring.main.web-application-type=none

# Redis Config (Default local dev)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# gRPC Config (Porta mTLS/TLS padrao da rede)
grpc.server.port=443

# Certificados da Autoridade Certificadora (mTLS)
ispchat.security.ca-cert-path=../ca/ca.crt
ispchat.security.node-cert-path=../ca/dev-node.crt
ispchat.security.node-key-path=../ca/dev-node.key
ispchat.security.dev-mode=true

# Ativar Virtual Threads no Java 25 LTS (sem pinning em blocos synchronized - JEP 491)
spring.threads.virtual.enabled=true
