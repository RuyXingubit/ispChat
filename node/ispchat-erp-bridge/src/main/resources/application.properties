spring.application.name=ispchat-erp-bridge

# Bind restrito por padrao a loopback/RFC1918 na LAN do Provedor ISP
server.address=${ISPCHAT_ERP_BIND_ADDRESS:127.0.0.1}
server.port=${ISPCHAT_ERP_PORT:8090}

# Conexao TLS 1.3 dedicada ao No ISP local (separada do filtro SSRF de federacao)
ispchat.erp.enabled=${ISPCHAT_ERP_ENABLED:true}
ispchat.erp.node-address=${ISPCHAT_ERP_NODE_ADDRESS:localhost:8443}
ispchat.erp.ca-cert-path=${ISPCHAT_CA_CERT_PATH:../ca/ca.crt}
ispchat.root.public-key=${ISPCHAT_ROOT_PUBLIC_KEY:}

# Segredos da API REST Local (Bearer) e Assinatura HMAC-SHA256 de Webhooks (IXC / SGP / MK-Auth)
ispchat.erp.api-bearer-secret=${ISPCHAT_ERP_API_SECRET:}
ispchat.erp.webhook-url=${ISPCHAT_ERP_WEBHOOK_URL:}
ispchat.erp.webhook-hmac-secret=${ISPCHAT_ERP_WEBHOOK_HMAC_SECRET:}
ispchat.erp.webhook-initial-backoff-ms=${ISPCHAT_ERP_WEBHOOK_INITIAL_BACKOFF_MS:1000}
ispchat.erp.webhook-max-backoff-ms=${ISPCHAT_ERP_WEBHOOK_MAX_BACKOFF_MS:60000}
ispchat.erp.webhook-max-attempts=${ISPCHAT_ERP_WEBHOOK_MAX_ATTEMPTS:20}

# Identidade Delegada ERP_API (Pareada via QR/URI no Celular Raiz do Socio/Admin do ISP)
ispchat.erp.device-ed25519-private-key=${ISPCHAT_ERP_DEVICE_ED25519_PRIV:}
ispchat.erp.device-x25519-private-key=${ISPCHAT_ERP_DEVICE_X25519_PRIV:}
ispchat.erp.delegation-cert-base64=${ISPCHAT_ERP_DELEGATION_CERT_B64:}
ispchat.erp.verification-credential-base64=${ISPCHAT_ERP_VERIFICATION_CRED_B64:}

# Limites Anti-Abuso de Entrada no Webhook para Remetentes Nao Verificados
ispchat.erp.unverified-per-sender-per-min=${ISPCHAT_ERP_UNVERIFIED_SENDER_RPM:10}
ispchat.erp.unverified-global-per-min=${ISPCHAT_ERP_UNVERIFIED_GLOBAL_RPM:120}
