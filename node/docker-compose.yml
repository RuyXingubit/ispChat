services:
  redis:
    image: redis:7-alpine
    container_name: ispchat-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - ispchat-net

  node:
    build:
      context: .
      dockerfile: ispchat-node/Dockerfile
    container_name: ispchat-node
    restart: always
    depends_on:
      - redis
    ports:
      - "443:8443/tcp"
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - ISPCHAT_GRPC_PORT=8443
      - ISPCHAT_DHT_NODE_ID=${ISPCHAT_DHT_NODE_ID:-01950000-0000-7000-8000-000000000001}
      - ISPCHAT_NODE_PUBLIC_ADDRESS=${ISPCHAT_NODE_PUBLIC_ADDRESS:-node1.ispchat.dev.br:443}
      - ISPCHAT_SRV_DOMAIN=${ISPCHAT_SRV_DOMAIN:-_ispchat._tcp.ispchat.dev.br}
      - ISPCHAT_ROOT_PUBLIC_KEY=${ISPCHAT_ROOT_PUBLIC_KEY:-}
      - ISPCHAT_PRINCIPAL_ADDRESS=${ISPCHAT_PRINCIPAL_ADDRESS:-principal.ispchat.dev.br:443}
      - ISPCHAT_TURN_SECRET=${TURN_STATIC_AUTH_SECRET:-change_me_in_env}
      - ISPCHAT_TURN_URIS=${ISPCHAT_TURN_URIS:-}
      - ISPCHAT_SECURITY_CA_CERT_PATH=/certs/ca.crt
      - ISPCHAT_SECURITY_NODE_CERT_PATH=/certs/node.crt
      - ISPCHAT_SECURITY_NODE_KEY_PATH=/certs/node.key
      - ISPCHAT_SECURITY_DEV_MODE=false
    volumes:
      - ./certs:/certs:ro
    networks:
      - ispchat-net

  coturn:
    image: coturn/coturn:latest
    container_name: ispchat-coturn
    restart: always
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49152-50152:49152-50152/udp"
    command:
      - "-c"
      - "/etc/coturn/turnserver.conf"
      - "--realm=${ISP_DOMAIN:-ispchat.dev.br}"
      - "--external-ip=${ISP_EXTERNAL_IP:-127.0.0.1}"
      - "--static-auth-secret=${TURN_STATIC_AUTH_SECRET:-change_me_in_env}"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs:/certs:ro
    networks:
      - ispchat-net

volumes:
  redis-data:

networks:
  ispchat-net:
    driver: bridge
