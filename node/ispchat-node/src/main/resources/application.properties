spring.application.name=ispchat-node

# Modo Headless: sem servidor HTTP/Tomcat na porta 8080 (toda comunicacao ocorre via gRPC TLS 1.3)
spring.main.web-application-type=none

# Redis Config
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# gRPC Config (Container non-root escuta em 8443; publicado externamente em 443:8443/tcp)
grpc.server.port=${ISPCHAT_GRPC_PORT:8443}
ispchat.node.public-address=${ISPCHAT_NODE_PUBLIC_ADDRESS:127.0.0.1:8443}

# Kademlia DHT & Descoberta DNS SRV
ispchat.dht.node-id=${ISPCHAT_DHT_NODE_ID:01950000-0000-7000-8000-000000000001}
ispchat.dht.srv-domain=${ISPCHAT_SRV_DOMAIN:_ispchat._tcp.ispchat.dev.br}
ispchat.dht.srv-bootstrap-enabled=${ISPCHAT_SRV_BOOTSTRAP_ENABLED:true}

# Governanca Raiz Nivel 0 & Servidor Principal
ispchat.root.public-key=${ISPCHAT_ROOT_PUBLIC_KEY:}
ispchat.principal.address=${ISPCHAT_PRINCIPAL_ADDRESS:}
ispchat.principal.fallback-address=${ISPCHAT_PRINCIPAL_FALLBACK_ADDRESS:${ispchat.principal.address:}}
ispchat.governance.revocation-sync-enabled=${ISPCHAT_REVOCATION_SYNC_ENABLED:true}

# Coturn TURN REST API (draft-uberti-behave-turn-rest)
ispchat.turn.static-auth-secret=${ISPCHAT_TURN_SECRET:}
ispchat.turn.uris=${ISPCHAT_TURN_URIS:}
ispchat.turn.max-bps=${ISPCHAT_TURN_MAX_BPS:64000}

# Certificados da Autoridade Certificadora (mTLS)
ispchat.security.ca-cert-path=${ISPCHAT_SECURITY_CA_CERT_PATH:../ca/ca.crt}
ispchat.security.node-cert-path=${ISPCHAT_SECURITY_NODE_CERT_PATH:../ca/dev-node.crt}
ispchat.security.node-key-path=${ISPCHAT_SECURITY_NODE_KEY_PATH:../ca/dev-node.key}
ispchat.security.dev-mode=${ISPCHAT_SECURITY_DEV_MODE:true}

# Ativar Virtual Threads no Java 25 LTS (sem pinning em blocos synchronized - JEP 491)
spring.threads.virtual.enabled=true
