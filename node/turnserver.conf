# ==============================================================================
# ISP Chat - Coturn STUN/TURN Server (Hardened Configuration)
# ==============================================================================
# Escuta em UDP/TCP 3478 (STUN/TURN) e TLS/DTLS 5349 (TURNS)
listening-port=3478
tls-listening-port=5349

# Habilita fingerprint CRC32 nas mensagens STUN (RFC 5389)
fingerprint

# Autenticacao baseada em segredo compartilhado (TURN REST API / Long-Term Secret)
use-auth-secret

# Certificados TLS (reaproveita os certificados do No ISP montados em /certs:ro)
cert=/certs/node.crt
pkey=/certs/node.key

# Seguranca e Privacidade: desabilita CLI administrativa e logs verbosos de sessao
no-cli
no-tlsv1
no-tlsv1_1
no-stdout-log

# Faixa de portas efemeras para relay de midia WebRTC (SRTP criptografado ponta-a-ponta)
min-port=49152
max-port=49252

# ==============================================================================
# PROTECAO ANTI-SSRF (Server-Side Request Forgery via TURN Relay)
# Bloqueia relay para loopback, multicast e redes privadas internas do Provedor
# ==============================================================================
no-loopback-peers
no-multicast-peers

denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
