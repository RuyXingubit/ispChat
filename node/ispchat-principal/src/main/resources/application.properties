spring.application.name=ispchat-principal
spring.main.web-application-type=none

# Servidor gRPC unificado (Governanca Principal + Diretorio CNPJ + Fallback Home Node)
grpc.server.enabled=${ISPCHAT_GRPC_ENABLED:true}
grpc.server.port=${ISPCHAT_GRPC_PORT:8443}

# PostgreSQL 17 + Flyway (Ledger Hash-Chained + Contas Verificadas + Revogacoes)
spring.datasource.url=${ISPCHAT_DB_URL:jdbc:postgresql://localhost:5432/ispchat_principal}
spring.datasource.username=${ISPCHAT_DB_USER:ispchat}
spring.datasource.password=${ISPCHAT_DB_PASSWORD:ispchat}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Redis 7 (DHT 30d + Filas Offline Ring-Buffer do Fallback Home Node)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# Endereco Publico do Principal / Fallback Home Node
ispchat.node.public-address=${ISPCHAT_PRINCIPAL_PUBLIC_ADDRESS:principal.ispchat.dev.br:443}
ispchat.principal.address=${ISPCHAT_PRINCIPAL_PUBLIC_ADDRESS:principal.ispchat.dev.br:443}
ispchat.principal.fallback-address=${ISPCHAT_PRINCIPAL_PUBLIC_ADDRESS:principal.ispchat.dev.br:443}
ispchat.dht.node-id=${ISPCHAT_DHT_NODE_ID:01950000-0000-7000-8000-000000000000}
ispchat.dht.srv-bootstrap-enabled=${ISPCHAT_SRV_BOOTSTRAP_ENABLED:true}
ispchat.dht.srv-domain=${ISPCHAT_SRV_DOMAIN:_ispchat._tcp.ispchat.dev.br}

# Desativa auto-assinatura circular de StreamRevocations no proprio Principal
ispchat.governance.revocation-sync-enabled=false

# Certificados X.509 mTLS da Federacao
ispchat.security.dev-mode=${ISPCHAT_DEV_MODE:false}
ispchat.security.ca-cert-path=${ISPCHAT_CA_CERT_PATH:../ca/ca.crt}
ispchat.security.node-cert-path=${ISPCHAT_NODE_CERT_PATH:../ca/dev-node.crt}
ispchat.security.node-key-path=${ISPCHAT_NODE_KEY_PATH:../ca/dev-node.key}

# Material Criptografico de Governanca (Chave Raiz Nivel 0 Offline, Chave Online do Principal e Pepper Argon2id)
ispchat.root.public-key=${ISPCHAT_ROOT_PUBLIC_KEY:}
ispchat.principal.signing-private-key=${ISPCHAT_PRINCIPAL_SIGNING_PRIVATE_KEY:}
ispchat.principal.signing-cert-base64=${ISPCHAT_PRINCIPAL_SIGNING_CERT_B64:}
ispchat.principal.blind-index-pepper=${ISPCHAT_PRINCIPAL_PEPPER:}
ispchat.principal.argon2-memory-kib=${ISPCHAT_ARGON2_MEMORY_KIB:65536}
ispchat.principal.argon2-iterations=${ISPCHAT_ARGON2_ITERATIONS:3}
ispchat.principal.argon2-concurrency=${ISPCHAT_ARGON2_CONCURRENCY:4}

# Coturn Stateless Shared Secret no Fallback Node
ispchat.turn.static-auth-secret=${ISPCHAT_TURN_SECRET:}
ispchat.turn.uris=${ISPCHAT_TURN_URIS:}
