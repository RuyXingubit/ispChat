# PowerDNS Configuration (Master)
# IMPORTANTE: Substitua SUA_SENHA_AQUI e CHAVE_API_DO_ENV_AQUI pelos valores reais que estão no seu .env

# Backend configuration
launch=gpgsql
gpgsql-host=db.local
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns_user
gpgsql-password=SUA_SENHA_AQUI

# DNS Server settings
local-address=0.0.0.0
local-port=5353
master=yes

# API and Webserver (to be proxied by Caddy)
api=yes
api-key=CHAVE_API_DO_ENV_AQUI
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0
