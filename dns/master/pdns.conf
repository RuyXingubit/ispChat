# PowerDNS Configuration

# Backend configuration
launch=gpgsql
gpgsql-host=db
gpgsql-port=5432
gpgsql-dbname=pdns
# gpgsql-user e gpgsql-password passados via docker-compose (PDNS_gpgsql_user / PDNS_gpgsql_password)

# DNS Server settings
local-address=0.0.0.0
local-port=53

# API and Webserver (to be proxied by Caddy)
api=yes
# api-key passado via docker-compose (PDNS_api_key)
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0
